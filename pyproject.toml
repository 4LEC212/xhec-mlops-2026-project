[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Alec Seugnet", email = "adseugnet5@gmail.com" },
  { name = "Simone Capizzi" },
  { name = "Korouhanba Khuman Laikhuram" },
  { name = "Tom Weinberg" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.14.1",
]

[dependency-groups]
app = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.1",
]

[tool.uv]
# This repository is an application, not a library: uv only installs its dependencies
package = false
default-groups = ["dev", "app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D"]
